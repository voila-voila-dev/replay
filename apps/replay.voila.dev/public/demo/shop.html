<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="robots" content="noindex" />
		<title>Demo shop · replay</title>
		<style>
			* { box-sizing: border-box; margin: 0 }
			html, body { height: 100% }
			body { font: 14px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; color: #0c0c0e; background: #f1f1ec; padding: 18px; overflow: hidden }
			.card { background: #fff; border: 1px solid #d9d9d4; border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 14px; height: 100% }
			header { display: flex; justify-content: space-between; align-items: center }
			h1 { font-size: 18px; letter-spacing: -.02em }
			.tabs { display: flex; gap: 4px; background: #f1f1ec; border-radius: 999px; padding: 3px }
			.tabs button { border: 0; background: none; padding: 5px 11px; border-radius: 999px; font: inherit; font-size: 12px; cursor: pointer; color: #77777f }
			.tabs button[aria-selected="true"] { background: #0c0c0e; color: #fff }
			.item { display: grid; grid-template-columns: 44px 1fr auto; gap: 12px; align-items: center }
			.thumb { width: 44px; height: 44px; border-radius: 10px; background: linear-gradient(135deg, #2633ff, #a9b1ff) }
			.item b { display: block }
			.item small { color: #77777f }
			.qty { display: flex; align-items: center; gap: 8px }
			.qty button { width: 26px; height: 26px; border-radius: 50%; border: 1px solid #d9d9d4; background: #fff; font: inherit; cursor: pointer }
			.qty button:hover { border-color: #2633ff; color: #2633ff }
			label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: #77777f }
			input { font: inherit; font-size: 14px; color: #0c0c0e; padding: 9px 11px; border: 1px solid #d9d9d4; border-radius: 9px; outline: none }
			input:focus { border-color: #2633ff; box-shadow: 0 0 0 3px #2633ff22 }
			.row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px }
			.total { display: flex; justify-content: space-between; border-top: 1px solid #ececE7; padding-top: 12px; margin-top: auto }
			.total b { font-size: 18px }
			.pay { border: 0; border-radius: 10px; padding: 12px; background: #2633ff; color: #fff; font: inherit; font-weight: 600; cursor: pointer }
			.pay:hover { background: #1a24c9 }
			.pay.done { background: #1fbf75 }
			.panel[hidden] { display: none }
			.reviews { display: flex; flex-direction: column; gap: 8px }
			.reviews p { background: #f6f6f3; border-radius: 9px; padding: 9px 11px }
			.stars { color: #c9971c; letter-spacing: 2px }
		</style>
	</head>
	<body>
		<div class="card">
			<header>
				<h1>Checkout</h1>
				<div class="tabs" role="tablist">
					<button role="tab" aria-selected="true" data-tab="cart">Cart</button>
					<button role="tab" aria-selected="false" data-tab="reviews">Reviews</button>
				</div>
			</header>

			<div class="panel" data-panel="cart">
				<div class="item">
					<span class="thumb"></span>
					<span><b>Trail shoes</b><small>Size 42 · Blue</small></span>
					<span class="qty"><button data-q="-1" aria-label="Less">−</button><span class="n">1</span><button data-q="1" aria-label="More">+</button></span>
				</div>
			</div>
			<div class="panel reviews" data-panel="reviews" hidden>
				<p><span class="stars">★★★★★</span><br />Light and grippy, great on wet rock.</p>
				<p><span class="stars">★★★★☆</span><br />Runs a bit small.</p>
			</div>

			<label>Email<input name="email" type="email" autocomplete="off" placeholder="you@example.com" /></label>
			<div class="row">
				<label>Card number<input name="card" inputmode="numeric" autocomplete="cc-number" placeholder="4242 4242 4242 4242" /></label>
				<label>Name on card<input name="name" autocomplete="off" placeholder="Ada Lovelace" /></label>
			</div>

			<div class="total"><span>Total</span><b class="sum">129 €</b></div>
			<button class="pay">Pay</button>
		</div>
		<script>
			const n = document.querySelector(".n");
			const sum = document.querySelector(".sum");
			const pay = document.querySelector(".pay");
			const set = (q) => {
				n.textContent = String(q);
				sum.textContent = `${q * 129} €`;
			};
			for (const b of document.querySelectorAll("[data-q]"))
				b.addEventListener("click", () => set(Math.max(1, Number(n.textContent) + Number(b.dataset.q))));
			for (const t of document.querySelectorAll("[data-tab]"))
				t.addEventListener("click", () => {
					for (const o of document.querySelectorAll("[data-tab]")) o.setAttribute("aria-selected", String(o === t));
					for (const p of document.querySelectorAll("[data-panel]")) p.hidden = p.dataset.panel !== t.dataset.tab;
				});
			pay.addEventListener("click", () => {
				pay.classList.add("done");
				pay.textContent = "Paid ✓";
				setTimeout(() => {
					pay.classList.remove("done");
					pay.textContent = "Pay";
				}, 1600);
			});
		</script>
	</body>
</html>
